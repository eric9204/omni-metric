# MySQL 配置（使用 --spring.profiles.active=mysql 激活）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/omni_metric?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
