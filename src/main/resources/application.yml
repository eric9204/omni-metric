server:
  port: 8080

spring:
  application:
    name: omni-metric

  # Default: H2 in-memory database (MySQL compatibility mode)
  datasource:
    url: jdbc:h2:mem:omni_metric;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: false
    open-in-view: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null

# Task executor configuration
app:
  task:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
    max-retry-count: 3

logging:
  level:
    com.example.omnimetric: INFO
    org.springframework.jdbc: WARN
